# Optional cloud release build. Triggered manually (workflow_dispatch) so it
# never clashes with locally-built releases uploaded via `gh release create`.
name: Release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach installers to (e.g. v0.5.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "GlowAudio Desktop ${{ inputs.tag }}"
          releaseDraft: false
